{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{% endblock %}
{% block content %}
<style>
    .form-header { margin-bottom: 28px; }
    .form-header-back { margin-bottom: 12px; text-align: left; }
    .form-header-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; text-align: center; }
</style>
<div class="form-header">
    <div class="form-header-back">
        <a href="{% url 'reorder_rule_list' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>
    <h1 class="form-header-title">{{ title }}</h1>
</div>
<div style="max-width:600px">
    <div class="card"><div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group"><label class="form-label">Product *</label>{{ form.product }}</div>
            <div class="form-group"><label class="form-label">Warehouse (blank = all)</label>{{ form.warehouse }}</div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Min Quantity *</label>{{ form.min_quantity }}</div>
                <div class="form-group"><label class="form-label">Max Quantity *</label>{{ form.max_quantity }}</div>
            </div>
            <div class="form-group"><label class="form-label">Default Supplier *</label>{{ form.default_supplier }}</div>
            <div style="display:flex;gap:12px;justify-content:center;margin-top:20px">
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"></i> Save</button>
                <a href="{% url 'reorder_rule_list' %}" class="btn btn-danger">Cancel</a>
            </div>
        </form>
    </div></div>
</div>
{% endblock %}
