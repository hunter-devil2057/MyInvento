{% extends 'base.html' %}
{% block title %}Start Count{% endblock %}
{% block page_title %}{% endblock %}
{% block content %}
<style>
    .form-header { margin-bottom: 28px; }
    .form-header-back { margin-bottom: 12px; text-align: left; }
    .form-header-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; text-align: center; }
</style>
<div class="form-header">
    <div class="form-header-back">
        <a href="{% url 'stock_count_list' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>
    <h1 class="form-header-title">Start New Count</h1>
</div>
<div style="max-width:500px;margin:0 auto">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Select Warehouse *</label>
                    {{ form.warehouse }}
                </div>
                <p class="text-muted text-sm">All products in this warehouse will be included in the count sheet.</p>
                <div class="flex gap-2 mt-4" style="justify-content:center;gap:12px">
                    <button type="submit" class="btn btn-success">Start Count</button>
                    <a href="{% url 'stock_count_list' %}" class="btn btn-danger">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
