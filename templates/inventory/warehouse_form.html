{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{% endblock %}
{% block content %}
<style>
    .form-header { margin-bottom: 28px; }
    .form-header-back { margin-bottom: 12px; text-align: left; }
    .form-header-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; text-align: center; }
</style>
<div class="form-header">
    <div class="form-header-back">
        <a href="{% url 'warehouse_list' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>
    <h1 class="form-header-title">{{ title }}</h1>
</div>
<div style="max-width:500px;margin:0 auto">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group"><label class="form-label">Name *</label>{{ form.name }}</div>
                <div class="form-group"><label class="form-label">Address</label>{{ form.address }}</div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">{{ form.is_active }} <span class="form-label" style="margin:0">Active</span></label>
                </div>
                <div class="flex gap-2" style="justify-content:center;gap:12px"><button type="submit" class="btn btn-success">Save</button><a href="{% url 'warehouse_list' %}" class="btn btn-danger">Cancel</a></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
