{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="flex-between mb-6">
    <a href="{% url 'warehouse_list' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back to Warehouses</a>
    <div></div>
    <div></div>
</div>
<div style="max-width:500px;margin:0 auto">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group"><label class="form-label">Name *</label>{{ form.name }}</div>
                <div class="form-group"><label class="form-label">Address</label>{{ form.address }}</div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">{{ form.is_active }} <span class="form-label" style="margin:0">Active</span></label>
                </div>
                <div class="flex gap-2"><button type="submit" class="btn btn-primary">Save</button><a href="{% url 'warehouse_list' %}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
