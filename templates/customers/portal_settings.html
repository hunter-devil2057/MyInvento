{% extends 'customers/portal_base.html' %}
{% block title %}Settings{% endblock %}
{% block portal_content %}
<div style="max-width:600px;margin:0 auto;padding:40px 32px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0"><i class="fa-solid fa-gear"></i></div>
        <div>
            <h1 style="font-size:26px;font-weight:800">Account Settings</h1>
            <p style="font-size:13px;color:var(--text-muted)">Manage your profile information</p>
        </div>
    </div>
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden">
        <div style="padding:24px">
            <form method="post">{% csrf_token %}
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:16px">
                    <div class="form-group"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-input" value="{{ user.first_name }}" placeholder="First name"></div>
                    <div class="form-group"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-input" value="{{ user.last_name }}" placeholder="Last name"></div>
                </div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-input" value="{{ user.email }}" placeholder="your@email.com"></div>
                <div class="form-group"><label class="form-label">Phone</label><input type="text" name="phone" class="form-input" value="{{ customer.phone|default:'' }}" placeholder="Phone number"></div>
                <button type="submit" class="btn btn-primary" style="margin-top:8px"><i class="fa-solid fa-check"></i> Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
