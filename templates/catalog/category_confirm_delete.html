{% extends 'base.html' %}
{% block title %}Delete Category{% endblock %}
{% block page_title %}Delete Category{% endblock %}
{% block content %}
<div style="max-width:500px">
    <div class="card">
        <div class="card-body" style="text-align:center;padding:40px">
            <h3>Delete "{{ category.name }}"?</h3>
            <p class="text-muted mt-2">This cannot be undone.</p>
            <form method="post" class="mt-6" style="display:flex;gap:8px;justify-content:center">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
