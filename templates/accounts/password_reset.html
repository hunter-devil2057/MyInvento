{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MyInvento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8eaff,#f0e6ff,#e0f0ff);padding:20px}
        [data-theme="dark"] body{background:linear-gradient(135deg,#04040e,#0a0418,#040a12)}
        .card{background:rgba(255,255,255,.7);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.45);border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(99,102,241,.1)}
        [data-theme="dark"] .card{background:rgba(10,12,28,.78);border-color:rgba(255,255,255,.06);box-shadow:0 24px 80px rgba(0,0,0,.6)}
        h1{font-size:24px;font-weight:800;margin-bottom:8px;color:#0f172a}
        [data-theme="dark"] h1{color:#f1f5f9}
        .subtitle{color:#475569;font-size:14px;margin-bottom:28px}
        [data-theme="dark"] .subtitle{color:#94a3b8}
        .field{margin-bottom:20px}
        label{display:block;font-size:13px;font-weight:600;color:#1e293b;margin-bottom:6px}
        [data-theme="dark"] label{color:#e2e8f0}
        input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;background:#fff;color:#0f172a}
        [data-theme="dark"] input{background:#1e293b;border-color:#334155;color:#f1f5f9}
        input:focus{border-color:#6366f1}
        .btn{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:12px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 6px 28px rgba(99,102,241,.35);transition:transform .2s}
        .btn:hover{transform:translateY(-2px)}
        .links{text-align:center;margin-top:20px;font-size:13px}
        .links a{color:#6366f1;text-decoration:none;font-weight:600}
        .links a:hover{text-decoration:underline}
        .err-box{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px}
        .success-box{background:#ecfdf5;border:1px solid #a7f3d0;color:#059669;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px}
        .info{background:#eff6ff;border:1px solid #bfdbfe;color:#2563eb;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:12px;line-height:1.6}
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fa-solid fa-lock" style="color:#6366f1;margin-right:8px"></i>Reset Password</h1>
        <p class="subtitle">Enter your email and set a new password</p>
        {% if messages %}
        {% for msg in messages %}
        <div class="{% if msg.tags == 'error' %}err-box{% else %}success-box{% endif %}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        <div class="info"><i class="fa-solid fa-circle-info" style="margin-right:4px"></i> Enter the email address associated with your account and choose a new password.</div>
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="field">
                <label>New Password</label>
                <input type="password" name="new_password" required minlength="6" placeholder="Min. 6 characters">
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <div class="links">
            <a href="{% url 'login' %}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
    <script>
        (function(){const s=localStorage.getItem('theme'),p=window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',s||(p?'dark':'light'))})();
    </script>
</body>
</html>
