{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block page_title %}Profile Settings{% endblock %}
{% block content %}
<div style="max-width:600px">
    <div class="card">
        <div class="card-header"><h3>Your Profile</h3></div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-input" value="{{ user.first_name }}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-input" value="{{ user.last_name }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" value="{{ user.email }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-input" value="{{ profile.phone|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-input" value="{{ profile.get_role_display }}" disabled>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
    <div class="card" style="margin-top:16px">
        <div class="card-body" style="display:flex;align-items:center;justify-content:space-between">
            <div>
                <div style="font-weight:700;font-size:14px">Password</div>
                <div style="font-size:12px;color:var(--text-muted)">Change your account password</div>
            </div>
            <a href="{% url 'password_change' %}" class="btn btn-outline btn-sm"><i class="fa-solid fa-key"></i> Change Password</a>
        </div>
    </div>
</div>
{% endblock %}
