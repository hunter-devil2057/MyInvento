{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="flex-between mb-6">
    <a href="{% url 'channel_list' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back to Channels</a>
    <div></div>
    <div></div>
</div>
<div style="max-width:500px;margin:0 auto">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Channel Name *</label>
                    {{ form.name }}
                    {% if form.name.errors %}<div class="form-error">{{ form.name.errors.0 }}</div>{% endif %}
                </div>
                <div class="flex gap-2" style="margin-top:20px">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
