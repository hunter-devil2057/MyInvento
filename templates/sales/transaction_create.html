{% extends 'base.html' %}
{% block title %}New Transaction{% endblock %}
{% block page_title %}New Sales Transaction{% endblock %}
{% block content %}
<div class="flex-between mb-6">
    <a href="{% url 'pos' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
    <div></div>
    <div></div>
</div>
<div style="max-width:600px"><div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
        <div class="form-group"><label class="form-label">Channel *</label>
            <select name="channel" class="form-input" required>{% for c in channels %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}</select>
        </div>
        <div class="form-group"><label class="form-label">Warehouse *</label>
            <select name="warehouse" class="form-input" required>{% for w in warehouses %}<option value="{{ w.pk }}">{{ w.name }}</option>{% endfor %}</select>
        </div>
        <div class="form-group"><label class="form-label">Customer (optional)</label>
            <select name="customer" class="form-input"><option value="">Walk-in customer</option>{% for c in customers %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}</select>
        </div>
        <button type="submit" class="btn btn-primary">Start Transaction</button>
    </form>
</div></div></div>
{% endblock %}
